# Автоматические тесты и сборка релиза (GameCI).
# Запуск: вручную (Actions → Build → Run workflow) или при публикации тега вида v1.2.0.
#
# Перед первым запуском добавьте секреты репозитория (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE  — содержимое файла лицензии Unity (.ulf), см. https://game.ci/docs/github/activation
#   UNITY_EMAIL    — e-mail аккаунта Unity
#   UNITY_PASSWORD — пароль аккаунта Unity
# Без секретов сценарий завершится ошибкой активации — на сам проект это не влияет.

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  tests:
    name: Тесты (EditMode + PlayMode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/manifest.json') }}
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Сборка ${{ matrix.targetPlatform }}
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - WebGL
          - Android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/manifest.json') }}
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          targetPlatform: ${{ matrix.targetPlatform }}
          # Наш метод сам собирает сцены (они генерируются кодом) и пишет build_info.json
          buildMethod: ReleaseBuildTool.BuildFromCommandLine
      - uses: actions/upload-artifact@v4
        with:
          name: BallCollector-${{ matrix.targetPlatform }}
          path: Builds/${{ matrix.targetPlatform }}

  release:
    name: Публикация GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Архивы сборок
        run: |
          cd artifacts
          for d in */; do zip -qr "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
